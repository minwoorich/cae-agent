# 처음 지원하는 Ansys 2026 R1의 내부 버전 번호이다.
[ansys]
version = "261"
workbench_port = 50055
headless = false

# AI 제공자의 인증정보는 이 파일에 저장하지 않는다.
[agent]
provider = "codex"
# 기본적으로 Codex 사용자 설정의 모델을 사용한다. 호환성 때문에 고정해야 할 때만
# 아래 주석을 해제하고 현재 Codex CLI가 지원하는 모델 이름을 입력한다.
# model = "gpt-5.4"
max_retries = 3
timeout_seconds = 300

# 상대경로는 이 설정 파일이 있는 폴더를 기준으로 해석한다.
[workspace]
root = "workspace"
