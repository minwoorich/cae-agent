name: 버그 보고
description: 민감정보를 제거한 재현 정보로 CAE Agent 문제를 보고합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        보고 전에 `docs/troubleshooting.ko.md`를 확인하세요.
        토큰, API 키, 라이선스 서버, 사용자 절대경로와 비공개 CAE 파일을 첨부하지 마세요.

  - type: checkboxes
    id: safety
    attributes:
      label: 민감정보 확인
      options:
        - label: 로그와 명령에서 토큰, 사용자 경로와 라이선스 정보를 제거했습니다.
          required: true
        - label: 비공개 CAD, Workbench 프로젝트와 고객 데이터를 첨부하지 않았습니다.
          required: true

  - type: input
    id: version
    attributes:
      label: CAE Agent 버전
      description: "`cae-agent --version` 결과를 입력하세요."
      placeholder: "cae-agent 0.1.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: Python, Codex CLI와 Ansys 버전만 입력하고 설치 경로는 제외하세요.
      placeholder: "Windows 11 / Python 3.11 / Codex CLI 버전 / Ansys V261"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 새 작업공간에서 재현되는 최소 명령과 입력을 작성하세요.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과와 정리된 오류
      description: 민감정보와 절대경로를 제거한 오류 부분만 붙여 넣으세요.
    validations:
      required: true
